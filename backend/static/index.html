<!DOCTYPE html>
<html>
<head>
    <title>AI Grader</title>
    <style>
        body { font-family: sans-serif; margin: 40px; max-width: 800px; margin: 0 auto; padding: 20px; }
        .upload-area { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 20px; border-radius: 8px; }
        .upload-area.dragover { border-color: #000; background-color: #f0f0f0; }
        input[type="file"] { display: none; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        textarea { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border: 1px solid #ccc; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>AI Grader</h1>
    
    <div id="answer-drop" class="upload-area">
        <p>Drag & Drop Answer PDF Here or <a href="#" onclick="document.getElementById('answer_pdf').click(); return false;">Browse</a></p>
        <input type="file" id="answer_pdf" accept="application/pdf">
        <p id="answer-name"></p>
    </div>

    <div id="question-drop" class="upload-area">
        <p>Drag & Drop Question PDF Here (Optional) or <a href="#" onclick="document.getElementById('question_pdf').click(); return false;">Browse</a></p>
        <input type="file" id="question_pdf" accept="application/pdf">
        <p id="question-name"></p>
    </div>

    <label for="question_text">Or Question Text:</label>
    <textarea id="question_text" rows="4" placeholder="Enter question text here if no PDF provided..."></textarea>

    <label for="rules">Grading Rules:</label>
    <textarea id="rules" rows="4" placeholder="Enter grading rules here..."></textarea>

    <button id="submit-btn" onclick="submitForm()">Grade Now</button>
    <div id="status" style="margin-top: 10px; font-weight: bold;"></div>

    <div id="result"></div>

    <script>
        function setupDropzone(dropId, inputId, nameId) {
            const drop = document.getElementById(dropId);
            const input = document.getElementById(inputId);
            const name = document.getElementById(nameId);

            drop.addEventListener('dragover', (e) => {
                e.preventDefault();
                drop.classList.add('dragover');
            });
            drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
            drop.addEventListener('drop', (e) => {
                e.preventDefault();
                drop.classList.remove('dragover');
                if (e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                    name.textContent = input.files[0].name;
                }
            });
            input.addEventListener('change', () => {
                if (input.files.length) name.textContent = input.files[0].name;
            });
        }

        setupDropzone('answer-drop', 'answer_pdf', 'answer-name');
        setupDropzone('question-drop', 'question_pdf', 'question-name');

        async function submitForm() {
            const answerPdf = document.getElementById('answer_pdf').files[0];
            const questionPdf = document.getElementById('question_pdf').files[0];
            const questionText = document.getElementById('question_text').value;
            const rules = document.getElementById('rules').value;

            if (!answerPdf) {
                alert("Please select an Answer PDF");
                return;
            }

            const formData = new FormData();
            formData.append('pdf', answerPdf);
            if (questionPdf) {
                formData.append('question_pdf', questionPdf);
            } else {
                formData.append('question', questionText);
            }
            formData.append('rules', rules);

            document.getElementById('status').innerText = 'Grading... Please wait.';
            document.getElementById('result').style.display = 'none';
            document.getElementById('submit-btn').disabled = true;

            try {
                const response = await fetch('/grade', {
                    method: 'POST',
                    body: formData
                });
                
                const text = await response.text();
                document.getElementById('status').innerText = response.ok ? 'Success!' : 'Error occurred';
                document.getElementById('result').style.display = 'block';
                
                try {
                    const json = JSON.parse(text);
                    document.getElementById('result').innerText = JSON.stringify(json, null, 2);
                } catch(e) {
                    document.getElementById('result').innerText = text;
                }
            } catch (error) {
                document.getElementById('status').innerText = 'Network error';
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').innerText = error.toString();
            }
            
            document.getElementById('submit-btn').disabled = false;
        }
    </script>
</body>
</html>
